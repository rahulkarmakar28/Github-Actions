name: 04 - Using Actions
on:
    push:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup node
              uses: actions/setup-node@v4
              with: 
                node-version: 24.x
                
            - name: Install Dependencies
              working-directory: 04-using-actions
              run: npm ci
